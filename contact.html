<html>
  <head>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Space+Grotesk%3Awght%40400%3B500%3B700"
    />
    <title>Stitch Design</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  </head>
  <body>
    <div
      class="relative flex h-auto min-h-screen w-full flex-col bg-[#171122] dark group/design-root overflow-x-hidden"
      style='font-family: "Space Grotesk", "Noto Sans", sans-serif;'
    >
      <div class="layout-container flex h-full grow flex-col">
        <header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#2f2348] px-10 py-3">
          <!-- Header içerikleri burada (Logo, Menü, İkonlar) -->
        </header>

        <div class="px-40 flex flex-1 justify-center py-5">
          <div class="layout-content-container flex flex-col max-w-[960px] flex-1">
            <div class="flex flex-wrap justify-between gap-3 p-4">
              <div class="flex min-w-72 flex-col gap-3">
                <p class="text-white tracking-light text-[32px] font-bold leading-tight">Contact Us</p>
                <p class="text-[#a492c9] text-sm font-normal leading-normal">We're here to help! Reach out with any questions or feedback.</p>
              </div>
            </div>

            <!-- Form Alanları -->
            <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
              <label class="flex flex-col min-w-40 flex-1">
                <p class="text-white text-base font-medium leading-normal pb-2">Name</p>
                <input
                  id="contact-name"
                  placeholder="Your Name"
                  class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-0 border-none bg-[#2f2348] focus:border-none h-14 placeholder:text-[#a492c9] p-4 text-base font-normal leading-normal"
                  value=""
                />
              </label>
            </div>

            <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
              <label class="flex flex-col min-w-40 flex-1">
                <p class="text-white text-base font-medium leading-normal pb-2">Email</p>
                <input
                  id="contact-email"
                  placeholder="Your Email"
                  class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-0 border-none bg-[#2f2348] focus:border-none h-14 placeholder:text-[#a492c9] p-4 text-base font-normal leading-normal"
                  value=""
                />
              </label>
            </div>

            <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
              <label class="flex flex-col min-w-40 flex-1">
                <p class="text-white text-base font-medium leading-normal pb-2">Subject</p>
                <input
                  id="contact-subject"
                  placeholder="Subject"
                  class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-0 border-none bg-[#2f2348] focus:border-none h-14 placeholder:text-[#a492c9] p-4 text-base font-normal leading-normal"
                  value=""
                />
              </label>
            </div>

            <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
              <label class="flex flex-col min-w-40 flex-1">
                <p class="text-white text-base font-medium leading-normal pb-2">Message</p>
                <textarea
                  id="contact-message"
                  placeholder="Your Message"
                  class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-0 border-none bg-[#2f2348] focus:border-none min-h-36 placeholder:text-[#a492c9] p-4 text-base font-normal leading-normal"
                ></textarea>
              </label>
            </div>

            <!-- Gönder Butonu -->
            <div class="flex px-4 py-3 justify-end">
              <button
                id="sendMessageBtn"
                class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-[#5b13ec] text-white text-sm font-bold leading-normal tracking-[0.015em]"
              >
                <span class="truncate">Send Message</span>
              </button>
            </div>

            <!-- Contact Information -->
            <h2 class="text-white text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5">Contact Information</h2>
            <div class="p-4 grid grid-cols-[20%_1fr] gap-x-6">
              <div class="col-span-2 grid grid-cols-subgrid border-t border-t-[#443267] py-5">
                <p class="text-[#a492c9] text-sm font-normal leading-normal">Email</p>
                <p class="text-white text-sm font-normal leading-normal">support@vibemovies.com</p>
              </div>
              <div class="col-span-2 grid grid-cols-subgrid border-t border-t-[#443267] py-5">
                <p class="text-[#a492c9] text-sm font-normal leading-normal">Phone</p>
                <p class="text-white text-sm font-normal leading-normal">+1 (555) 123-4567</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        const sendBtn = document.getElementById("sendMessageBtn");

        sendBtn.addEventListener("click", () => {
          const name = document.getElementById("contact-name").value.trim();
          const email = document.getElementById("contact-email").value.trim();
          const subject = document.getElementById("contact-subject").value.trim();
          const message = document.getElementById("contact-message").value.trim();

          console.log("Contact Form Submission:");
          console.log("Name:", name);
          console.log("Email:", email);
          console.log("Subject:", subject);
          console.log("Message:", message);
        });
      </script>
    </div>
  </body>
</html>
